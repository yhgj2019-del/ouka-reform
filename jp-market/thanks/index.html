<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>已收到 · 桜華国際</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/jpeg" href="../../logo.jpg">
<style>
  :root{--ink:#14233b;--paper:#f6f4ef;--muted:#5c6675;--line:#e2ddd3;--gold:#b5714a;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
    background:var(--paper);color:var(--ink);line-height:1.8;display:flex;align-items:center;
    justify-content:center;min-height:100vh;padding:24px;}
  .box{max-width:520px;text-align:center;background:#fff;border:1px solid var(--line);
    border-radius:16px;padding:52px 40px;}
  .tick{width:62px;height:62px;border-radius:50%;background:#eef1f6;color:var(--gold);
    display:flex;align-items:center;justify-content:center;font-size:30px;margin:0 auto 22px;}
  h1{font-size:26px;font-weight:800;margin-bottom:14px;}
  p{color:var(--muted);font-size:15.5px;margin-bottom:12px;}
  .wechat{background:var(--paper);border:1px solid var(--line);border-radius:10px;
    padding:18px;margin:26px 0 22px;}
  .wechat .k{font-size:12px;letter-spacing:.14em;color:var(--gold);font-weight:700;margin-bottom:4px;}
  .wechat .v{font-size:19px;font-weight:700;letter-spacing:.03em;}
  a.back{display:inline-block;margin-top:8px;color:var(--ink);font-weight:600;
    text-decoration:underline;font-size:14.5px;}
</style>
</head>
<body>
  <div class="box">
    <div class="tick">✓</div>
    <h1>收到了，谢谢</h1>
    <p>我们一般在 <b>1–2 个工作日</b>内回复你，会先出一页速判：日本同类价格带、渠道、认证门槛。</p>
    <p>想快一点，或者要发图纸和产品照片——直接加微信：</p>
    <div class="wechat">
      <div class="k">微信 WeChat</div>
      <div class="v">ouka-reform</div>
    </div>
    <p style="font-size:14px;">电话 +81 90-8527-5777（日本时间 09:00–19:00）</p>
    <a class="back" href="/jp-market/">← 返回</a>
  </div>
</body>
</html>
